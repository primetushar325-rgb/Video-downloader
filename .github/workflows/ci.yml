# Main CI: builds the app, runs the JVM unit-test suite and lints the sources.
# On success it commits the debug APK to dist/ and the test report to ci-reports/.
name: ci

on:
  push:
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "vendor/**"
      - "README.md"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Unit tests
        id: unit-tests
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest --stacktrace
          rc=$?
          # Surface every failing test as a check-run annotation so failures are
          # diagnosable even when raw log archives are unavailable.
          python3 - <<'EOF'
          import glob, re, html, os
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              txt = open(f, encoding="utf-8").read()
              for m in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>(.*?)</testcase>', txt, re.S):
                  inner = m.group(3)
                  fm = re.search(r'<failure[^>]*message="([^"]*)"', inner)
                  em = re.search(r'<error[^>]*message="([^"]*)"', inner)
                  if fm or em:
                      msg = html.unescape((fm or em).group(1)).replace('"', "'")[:900]
                      print(f"::error file={m.group(2)},title=Test failed::{m.group(1)} :: {msg}")
          EOF
          exit $rc

      - name: Collect test report
        if: always()
        run: |
          mkdir -p ci-reports
          cp app/build/reports/tests/testDebugUnitTest/index.html ci-reports/unit-tests.html 2>/dev/null || true
          cp app/build/test-results/testDebugUnitTest/*.xml ci-reports/ 2>/dev/null || true
          python3 - <<'EOF'
          import glob, os, re
          summary = []
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              txt = open(f, encoding="utf-8").read()
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', txt)
              if m:
                  summary.append(f"{os.path.basename(f)}: tests={m.group(1)} failures={m.group(3)} errors={m.group(4)}")
          open("ci-reports/unit-test-summary.txt", "w").write("\n".join(summary))
          EOF
          cat ci-reports/unit-test-summary.txt

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VIDX-debug.apk
          ls -la dist/

      - name: Commit artifacts
        if: always() && github.event_name == 'push'
        run: |
          git config user.name  "vidx-ci-bot"
          git config user.email "vidx-ci-bot@users.noreply.github.com"
          git add ci-reports/ 2>/dev/null || true
          git add dist/VIDX-debug.apk 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "ci: build artifacts for $(git rev-parse --short HEAD)"
            git push
          fi
